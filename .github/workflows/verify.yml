name: Verify WarLike Heart
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check local-brain.js
          node --check learning-brain.js
          node --check learning-panel.js
          node --check brain-web.js
          node --check functions/api/research.js
          node --check notifications/scheduler.mjs
          node --check app.js
          node --check avatar3d.js
          node --check avatar-space.js
          node --check avatar-publish.js
          node --check functions/api/avatar.js
          node --check avatar-rig.mjs
          node --check lib/model-router.mjs
          node --check functions/api/chat.js
          node --check functions/api/account.js
          node --check functions/api/memory.js
          node --check cloud-memory.js
          node --check functions/_server-transport.js
          node --check heart-account.js
          node --check navigation.js
          node --check goal-panel.js
          node --check agent-panel.js
          node --check agent-workspace.js
          node --check lib/agent-execution.mjs
          node --check lib/plugin-policy.mjs
          node --check lib/plugin-permissions.mjs
          node --check lib/plugin-health.mjs
          node --check lib/plugin-gateway.mjs
          node --check lib/agent-registry.mjs
          node --check functions/api/agents.js
          node --check readiness-panel.js
          node --check lib/heart-readiness.mjs
          node --check functions/api/readiness.js
          node --check vision-panel.js
          node --check lib/vision.mjs
          node --check functions/api/vision.js
          node --check reasoning-panel.js
          node --check lib/reasoning.mjs
          node --check functions/api/reasoning.js
          node --check graph-panel.js
          node --check functions/api/knowledge-graph.js
          node --check cognitive-panel.js
          node --check lib/cognitive-memory.mjs
          node --check functions/api/cognitive-memory.js
          node --check functions/api/goals.js
          node --check functions/api/server-status.js
      - name: Run backend API regression tests
        run: node --test tests/*.test.mjs
      - name: Verify displayed version matches documented version
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const html=fs.readFileSync("index.html","utf8");
            const readme=fs.readFileSync("README.md","utf8");
            const versions=[...readme.matchAll(/^## Version v(\d+\.\d+(?:\.\d+)?(?:-[0-9A-Za-z.-]+)?)(?=\s|$)/gm)].map(x=>x[1]);
            assert.ok(versions.length,"No documented release version found");
            const expected=versions.at(-1);
            const metadata=JSON.parse(fs.readFileSync("version.json","utf8"));
            assert.equal(metadata.version,expected,"Version metadata must match README");
            assert.ok(html.includes("<title>WarLike Heart · v"+expected+"</title>"),"Page title must match README");
            assert.ok(html.includes("WARLIKE HEART · v"+expected), "Header badge must match README");
          '
      - name: Check required UI and endpoints
        run: |
          test -f index.html
          test -f app.js
          test -f avatar3d.js
          test -f functions/api/chat.js
          test -f functions/api/server-status.js
          grep -q 'id="officialPortrait"' index.html
          grep -q 'id="modelFile"' index.html
          grep -q 'id="accessToken"' index.html
