name: Verify WarLike Heart
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check local-brain.js
          node --check learning-brain.js
          node --check learning-panel.js
          node --check notifications/scheduler.mjs
          node --check app.js
          node --check avatar3d.js
          node --check avatar-rig.mjs
          node --check functions/api/chat.js
          node --check functions/api/account.js
          node --check heart-account.js
          node --check functions/api/server-status.js
      - name: Run backend API regression tests
        run: node --test tests/*.test.mjs
      - name: Verify displayed version matches documented version
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const html=fs.readFileSync("index.html","utf8");
            const readme=fs.readFileSync("README.md","utf8");
            const versions=[...readme.matchAll(/## Version v(\d+\.\d+)/g)].map(x=>x[1]);
            assert.ok(versions.length,"No documented release version found");
            const expected=versions.at(-1);
            assert.ok(html.includes("<title>WarLike Heart · v"+expected+"</title>"),"Page title must match README");
            assert.ok(html.includes("WARLIKE HEART · v"+expected), "Header badge must match README");
          '
      - name: Check required UI and endpoints
        run: |
          test -f index.html
          test -f app.js
          test -f avatar3d.js
          test -f functions/api/chat.js
          test -f functions/api/server-status.js
          grep -q 'id="officialPortrait"' index.html
          grep -q 'id="modelFile"' index.html
          grep -q 'id="accessToken"' index.html
